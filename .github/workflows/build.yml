# Builds the app on every push to main and publishes it as a GitHub release.
# Obtainium on the phone watches the releases and offers each new one as an update.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Signing secrets aren't set, so this build is only a test and won't be released to the phone."
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "SpurwingGPS-1.0.$BUILD_NUMBER.apk"
          # The app bundle is the format Google Play takes.
          cp app/build/outputs/bundle/release/app-release.aab "SpurwingGPS-1.0.$BUILD_NUMBER.aab"

      - name: Publish release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SpurWing GPS 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            SpurwingGPS-1.0.${{ github.run_number }}.apk
            SpurwingGPS-1.0.${{ github.run_number }}.aab
